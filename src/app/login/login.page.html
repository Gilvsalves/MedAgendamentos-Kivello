<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">

    <div>
      <img src="assets/fotoMed.png" alt="Imagem Descrição" class="header-image">
    </div>
    
    <strong class="title">NOME DA EMPRESA</strong>
    <p>Realize seu login para agendar:</p>

    <div id="container2">

      <ion-item class="input-item">
        <ion-input
          label="CPF"
          labelPlacement="stacked"
          [clearOnEdit]="true"
          placeholder="000.000.000-00"
          maxlength="14"
          (ionInput)="formatCPF($event)"
          [(ngModel)]="cpf"
        >
        </ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-input
          label="SENHA"
          labelPlacement="stacked"
          type="password"
          placeholder="******************"
        >
        <ion-input-password-toggle color="light" slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>

      <ion-button color="light" id="button-entrar">
        <span class="button-text">Entrar</span>
      </ion-button>
    </div>

    <p>NÃO TEM CADASTRO? <a routerLink="/cadastro">CADASTRE-SE AQUI</a></p>
  </div>

</ion-content>
